<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自媒体中控台 · 原型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --r:14px; --fs:14px; --pad:18px;
  --dy:#00D8C8; --xhs:#FF2442; --xy:#FFC300;
}
:root[data-theme="dark"]{
  --bg:#080C11; --surface:#0F151D; --surface2:#151E28; --border:#1C2833;
  --border2:#26343F;
  --text:#E8EFF7; --text2:#8496A8; --text3:#54646F;
  --accent:#2FD9A6; --accent2:#0E2E27; --on-accent:#04221B;
  --red:#FF6B6B; --red-bg:rgba(255,107,107,.1);
  --amber:#FFB454; --amber-bg:rgba(255,180,84,.1);
  --green:#2FD9A6; --green-bg:rgba(47,217,166,.1);
  --grid:#182430;
  --shadow:0 8px 24px -12px rgba(0,0,0,.8);
  --dy:#00D8C8; --xhs:#FF4D6A; --xy:#FFC53D;
}
:root[data-theme="light"]{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface2:#F2F4F7; --border:#E6E9EE;
  --border2:#D8DDE5;
  --text:#111827; --text2:#6B7280; --text3:#9AA3AF;
  --accent:#0EA36B; --accent2:#E8F7F1; --on-accent:#FFFFFF;
  --red:#E5484D; --red-bg:#FDECEC;
  --amber:#C97A16; --amber-bg:#FDF3E3;
  --green:#0EA36B; --green-bg:#E8F7F1;
  --grid:#EDF0F4;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -16px rgba(16,24,40,.18);
  --dy:#0E9F92; --xhs:#E11D48; --xy:#B8860B;
}
:root[data-theme="dense"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F5F7FA; --border:#DCE1E8;
  --border2:#C9D0DA;
  --text:#0F172A; --text2:#475569; --text3:#94A3B8;
  --accent:#1B64F2; --accent2:#EBF1FE; --on-accent:#FFFFFF;
  --red:#DC2626; --red-bg:#FEF2F2;
  --amber:#B45309; --amber-bg:#FFFBEB;
  --green:#15803D; --green-bg:#F0FDF4;
  --r:5px; --fs:13px; --pad:13px;
  --grid:#EEF1F5;
  --shadow:none;
  --dy:#0B8C82; --xhs:#DC2626; --xy:#A16207;
}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:var(--fs); -webkit-font-smoothing:antialiased; line-height:1.5;
}
::selection{background:var(--accent);color:var(--on-accent)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:212px;flex:0 0 212px;border-right:1px solid var(--border);
  background:var(--surface);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;padding:16px 12px;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 20px}
.brand-mark{
  width:26px;height:26px;border-radius:8px;flex:0 0 26px;
  background:linear-gradient(135deg,var(--accent),#5B9DFF);
  display:grid;place-items:center;color:#04221B;font-weight:800;font-size:13px;
}
.brand-name{font-weight:650;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--text3);margin-top:-2px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  color:var(--text2);cursor:pointer;font-size:13.5px;transition:.12s;user-select:none;
  border:1px solid transparent;
}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent2);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 22%,transparent);font-weight:600}
.nav-item svg{flex:0 0 16px;opacity:.9}
.nav-num{margin-left:auto;font-size:11px;font-family:var(--mono);color:var(--text3)}
.nav-item.active .nav-num{color:var(--accent)}

.side-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text3);padding:6px 8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.pulse{animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:58px;display:flex;align-items:center;gap:14px;padding:0 24px;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);
}
.page-title{font-size:15px;font-weight:650}
.page-sub{font-size:12px;color:var(--text3);margin-top:1px}
.spacer{flex:1}
.themes{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.themes button{
  border:0;background:transparent;color:var(--text2);font-family:inherit;font-size:12px;
  padding:5px 11px;border-radius:7px;cursor:pointer;transition:.12s;white-space:nowrap;
}
.themes button:hover{color:var(--text)}
.themes button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.icon-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;
  color:var(--text2);display:grid;place-items:center;cursor:pointer;
}
.icon-btn:hover{color:var(--text);background:var(--surface2)}
.avatar{
  width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#5B9DFF,#A78BFA);
  display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;cursor:pointer;
}

.content{padding:22px 24px 48px;max-width:1400px;width:100%}
.view{display:none}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-head{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-head h2{font-size:13px;font-weight:650;letter-spacing:.3px;color:var(--text)}
.sec-head .hint{font-size:11.5px;color:var(--text3)}
.sec-head .more{margin-left:auto;font-size:12px;color:var(--text2);cursor:pointer}
.sec-head .more:hover{color:var(--accent)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g-2-1{grid-template-columns:1.62fr 1fr}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g-2-1{grid-template-columns:1fr}}

.kpi{padding:var(--pad);position:relative;overflow:hidden}
.kpi-label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.kpi-value{font-size:27px;font-weight:680;letter-spacing:-.6px;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--text3)}
.trend{font-family:var(--mono);font-size:12px;font-weight:600;padding:1px 6px;border-radius:5px}
.up{color:var(--green);background:var(--green-bg)}
.down{color:var(--red);background:var(--red-bg)}
.kpi-spark{position:absolute;right:14px;bottom:14px;opacity:.85}

/* ---------- accounts ---------- */
.acc{padding:var(--pad);display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:.16s;position:relative}
.acc:hover{border-color:var(--border2);transform:translateY(-1px)}
.acc-top{display:flex;align-items:center;gap:10px}
.plat{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:11px;font-weight:800;flex:0 0 30px;letter-spacing:-.4px;
}
.acc-name{font-size:13.5px;font-weight:600}
.acc-handle{font-size:11.5px;color:var(--text3);font-family:var(--mono)}
.acc-nums{display:flex;gap:22px}
.acc-num b{display:block;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.acc-num span{font-size:11px;color:var(--text3)}
.acc-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--border);padding-top:11px;font-size:11.5px;color:var(--text3)}
.mini-bars{display:flex;align-items:flex-end;gap:2.5px;height:22px}
.mini-bars i{width:4px;border-radius:2px;background:var(--border2);display:block}
.mini-bars i.hot{background:var(--accent)}

/* ---------- alerts ---------- */
.alert-list{display:flex;flex-direction:column}
.alert{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);transition:.12s}
.alert:last-child{border-bottom:0}
.alert:hover{background:var(--surface2)}
.alert-bar{width:3px;border-radius:2px;flex:0 0 3px;align-self:stretch}
.a-red .alert-bar{background:var(--red)}
.a-amber .alert-bar{background:var(--amber)}
.a-green .alert-bar{background:var(--green)}
.alert-body{flex:1;min-width:0}
.alert-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;letter-spacing:.2px}
.a-red .tag{color:var(--red);background:var(--red-bg)}
.a-amber .tag{color:var(--amber);background:var(--amber-bg)}
.a-green .tag{color:var(--green);background:var(--green-bg)}
.alert-text{font-size:12.5px;color:var(--text2);margin-top:5px;line-height:1.55}
.alert-act{
  display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11.5px;
  color:var(--accent);cursor:pointer;font-weight:600;
}
.alert-act:hover{text-decoration:underline}
.alert-time{font-size:11px;color:var(--text3);white-space:nowrap;font-family:var(--mono)}

/* ---------- chart ---------- */
.chart-wrap{padding:var(--pad);display:flex;flex-direction:column;gap:4px}
.chart-head{display:flex;align-items:baseline;gap:10px}
.chart-val{font-size:22px;font-weight:680;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.chart-legend{display:flex;gap:14px;font-size:11.5px;color:var(--text3);margin-top:2px}
.chart-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  text-align:left;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.4px;
  padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
  background:var(--surface2);
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:.1s;cursor:pointer}
tbody tr:hover{background:var(--surface2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.t-title{display:flex;align-items:center;gap:9px;min-width:220px}
.t-thumb{width:34px;height:34px;border-radius:7px;flex:0 0 34px;display:grid;place-items:center;font-size:15px;background:var(--surface2);border:1px solid var(--border)}
.t-title b{font-weight:550;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
.t-title span{font-size:11px;color:var(--text3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--text2);white-space:nowrap}
.rate{display:inline-flex;align-items:center;gap:6px}
.rate-bar{width:44px;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.rate-bar i{display:block;height:100%;background:var(--accent);border-radius:2px}

/* ---------- inbox ---------- */
.inbox{display:grid;grid-template-columns:308px 1fr;min-height:560px;overflow:hidden}
@media(max-width:1000px){.inbox{grid-template-columns:1fr}}
.conv-list{border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.conv-filter{display:flex;gap:5px;padding:12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.chip{
  font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);
  color:var(--text2);cursor:pointer;background:transparent;font-family:inherit;transition:.12s;
}
.chip:hover{color:var(--text);border-color:var(--border2)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.convs{overflow-y:auto;flex:1;max-height:520px}
.conv{display:flex;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:.1s}
.conv:hover{background:var(--surface2)}
.conv.on{background:var(--accent2);border-left:2px solid var(--accent);padding-left:12px}
.conv-av{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.conv-main{flex:1;min-width:0}
.conv-row{display:flex;align-items:center;gap:6px}
.conv-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-time{margin-left:auto;font-size:10.5px;color:var(--text3);white-space:nowrap;font-family:var(--mono)}
.conv-msg{font-size:11.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.badge{min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;flex:0 0 auto}
.thread{display:flex;flex-direction:column;min-width:0}
.thread-head{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border)}
.thread-body{flex:1;padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:360px;background:var(--surface2)}
.msg{max-width:74%;padding:9px 13px;border-radius:12px;font-size:12.5px;line-height:1.55;position:relative}
.msg.in{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg.out{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-bottom-right-radius:4px}
.msg-t{font-size:10px;opacity:.6;margin-top:5px;font-family:var(--mono)}
.suggest-bar{padding:12px 18px;border-top:1px solid var(--border);background:var(--surface)}
.suggest-bar .lbl{font-size:11px;color:var(--text3);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.quick{display:flex;gap:7px;flex-wrap:wrap}
.quick button{
  font-family:inherit;font-size:11.5px;padding:6px 11px;border-radius:7px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface2);color:var(--text2);transition:.12s;
}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.composer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border);align-items:center}
.composer input{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:8px 12px;color:var(--text);font-family:inherit;font-size:12.5px;outline:none;
}
.composer input:focus{border-color:var(--accent)}
.btn{
  font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:8px;
  border:1px solid transparent;background:var(--accent);color:var(--on-accent);cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--text2)}
.btn.ghost:hover{border-color:var(--border2);color:var(--text)}

/* ---------- benchmark ---------- */
.bk-row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--border);transition:.12s}
.bk-row:last-child{border-bottom:0}
.bk-row:hover{background:var(--surface2)}
.bk-rank{font-family:var(--mono);font-size:12px;color:var(--text3);width:20px;flex:0 0 20px}
.bk-rank.top{color:var(--amber);font-weight:700}
.bk-cover{width:44px;height:58px;border-radius:7px;flex:0 0 44px;display:grid;place-items:center;font-size:15px;color:rgba(255,255,255,.92);overflow:hidden;position:relative}
.bk-main{flex:1;min-width:0}
.bk-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-sub{font-size:11.5px;color:var(--text3);margin-top:3px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.bk-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.bk-tags span{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.bk-num{text-align:right;min-width:76px}
.bk-num b{display:block;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.bk-num span{font-size:10.5px;color:var(--text3)}
.bk-ratio{text-align:right;min-width:76px}
.bk-ratio b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--mono);letter-spacing:-.5px}
.bk-ratio span{font-size:10.5px;color:var(--text3)}
.ratio-hot b{color:var(--red)}
.ratio-warm b{color:var(--amber)}
.ratio-cool b{color:var(--text2)}
.statusbar{display:flex;align-items:center;gap:12px;padding:13px 16px;flex-wrap:wrap}
.statusbar b{color:var(--text);font-variant-numeric:tabular-nums}
.cmp-row{display:grid;grid-template-columns:126px 200px 200px 1fr;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:12.5px}
.cmp-bar{flex:1;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;min-width:80px}
.cmp-bar i{display:block;height:100%;border-radius:3px;background:var(--red);opacity:.7}
.cmp-bar.ok i{background:var(--green);opacity:.85}
.cmp-row:last-child{border-bottom:0}
.cmp-row:hover{background:var(--surface2)}
.cmp-dim{color:var(--text2)}
.cmp-v{font-variant-numeric:tabular-nums}
.cmp-v span{color:var(--text3);font-size:11px;margin-left:4px}
.verdict{font-size:11px;padding:2px 8px;border-radius:5px;display:inline-block;white-space:nowrap}
.v-bad{color:var(--red);background:var(--red-bg)}
.v-ok{color:var(--green);background:var(--green-bg)}
.dir-item{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.dir-item:last-child{border-bottom:0}
.dir-k{font-size:11px;color:var(--text3);width:66px;flex:0 0 66px;padding-top:1px}
.dir-v{font-size:12.5px;line-height:1.6;color:var(--text2)}
.dir-v b{color:var(--text);font-weight:650}

/* ---------- advisor ---------- */
.sugg{padding:var(--pad);display:flex;flex-direction:column;gap:11px}
.sugg-head{display:flex;align-items:center;gap:8px}
.sugg h3{font-size:13.5px;font-weight:650;line-height:1.4}
.sugg p{font-size:12.5px;color:var(--text2);line-height:1.6}
.evidence{display:flex;flex-direction:column;gap:5px;border-left:2px solid var(--border);padding-left:10px}
.evidence div{font-size:11.5px;color:var(--text3);font-family:var(--mono)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts span{
  font-size:11.5px;padding:4px 9px;border-radius:6px;background:var(--surface2);
  border:1px solid var(--border);color:var(--text2);
}
.conf{margin-left:auto;font-size:10.5px;font-family:var(--mono);color:var(--text3)}

.note{
  display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:9px;
  background:var(--surface2);border:1px dashed var(--border2);font-size:11.5px;color:var(--text3);
  margin-top:22px;
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">◈</div>
      <div>
        <div class="brand-name">中控台</div>
        <div class="brand-sub">Creator OS</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="sync"><span class="dot pulse"></span> 采集正常 · 2 分钟前</div>
      <div class="sync"><span class="dot" style="background:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)"></span> 闲鱼采集延迟 12 分钟</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="page-title" id="ptitle">总览</div>

/* ============ 工具 ============ */
const fmt = n => n >= 10000 ? (n/10000).toFixed(1).replace(/\.0$/,'') + '万' : n.toLocaleString();
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
/* 平台色随主题变化：浅色主题下必须压深，否则青色在白色背景上几乎看不清 */
const pcolor = k => css(P[k].v);

function sparkline(data, color, w=62, h=20){
  const min=Math.min(...data), max=Math.max(...data), span=(max-min)||1;
  const pts = data.map((v,i)=>[ (i/(data.length-1))*(w-2)+1, h-3-((v-min)/span)*(h-6) ]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none">
    <path d="${d}" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function areaChart(data, labels, color, w=520, h=150){
  const lo = Math.min(...data), hi = Math.max(...data);
  const pad = ((hi-lo) || Math.abs(hi)*0.1 || 1) * 0.45;   // 自适应区间，避免曲线被压平
  const min = lo - pad, max = hi + pad;
  const px = i => 8 + (i/(data.length-1))*(w-16);
  const py = v => h-22 - ((v-min)/(max-min))*(h-40);
  const line = data.map((v,i)=>(i?'L':'M')+px(i).toFixed(1)+' '+py(v).toFixed(1)).join(' ');
  const area = line + ` L${px(data.length-1).toFixed(1)} ${h-22} L${px(0).toFixed(1)} ${h-22} Z`;
  const gid = 'g'+Math.random().toString(36).slice(2,7);
  let grid='', ticks='';
  for(let i=0;i<4;i++){
    const y = 14 + i*((h-40)/3);
    grid += `<line x1="8" y1="${y}" x2="${w-8}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
  }
  labels.forEach((lb,i)=>{
    ticks += `<text x="${px(i)}" y="${h-6}" fill="var(--text3)" font-size="10" text-anchor="middle" font-family="var(--mono)">${lb}</text>`;
  });
  const dots = data.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v).toFixed(1)}" r="2.6" fill="var(--surface)" stroke="${color}" stroke-width="1.8"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="overflow:visible">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" stroke="${color}" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${ticks}
  </svg>`;
}

  document.getElementById('v-accounts').innerHTML = renderAccounts();
  document.getElementById('v-bench').innerHTML = renderBench();
}

document.getElementById('themes').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  S.theme = b.dataset.t;
  document.documentElement.dataset.theme = S.theme;
  document.querySelectorAll('#themes button').forEach(x=>x.classList.toggle('on', x===b));
  try{ localStorage.setItem('theme', S.theme); }catch(e){}
  renderView();  // 图表用 var() 重绘，避免主题切换后颜色错乱
});

try{
  const t = localStorage.getItem('theme');
  if(t){ S.theme = t; document.documentElement.dataset.theme = t;
    document.querySelectorAll('#themes button').forEach(x=>x.classList.toggle('on', x.dataset.t===t)); }
}catch(e){}

/* 支持 ?theme=light&view=inbox&filter=xianyu 直接跳转，方便截图/分享 */
const qs = new URLSearchParams(location.search);
if(qs.get('theme')){ S.theme = qs.get('theme');
  document.documentElement.dataset.theme = S.theme;
  document.querySelectorAll('#themes button').forEach(x=>x.classList.toggle('on', x.dataset.t===S.theme)); }
if(qs.get('filter')) S.filter = qs.get('filter');
if(qs.get('conv')) S.conv = Number(qs.get('conv'));
if(qs.get('view')) S.view = qs.get('view');

renderNav();
renderView();
if(S.view !== 'dash') go(S.view);
</script>
</body>
